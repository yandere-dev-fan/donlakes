# HTTP-only bootstrap for the ACME challenge, before the first certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ www.donozera.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 308 https://donozera.ru$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name donozera.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    include /etc/nginx/snippets/donozera-site.conf;
}
