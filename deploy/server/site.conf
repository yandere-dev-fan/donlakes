    root /var/www/donozera/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
    error_page 404 /404.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~* ^/(admin(?:/|$)|api(?:/|$)|map-review(?:/|$)) { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:md|mjs|ts|tsx|ya?ml|env|json)$ { return 404; }
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.(webp|png|jpg|jpeg|svg|mp4|woff2?)$ { expires 1d; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
