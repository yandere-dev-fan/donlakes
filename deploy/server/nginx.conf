# Installed after a certificate has been issued by enable-domain.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name donozera.ru www.donozera.ru _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 308 https://donozera.ru$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.donozera.ru;
    ssl_certificate /etc/letsencrypt/live/donozera.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donozera.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://donozera.ru$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name donozera.ru;
    ssl_certificate /etc/letsencrypt/live/donozera.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donozera.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DonozeraSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/donozera-site.conf;
}
